name: Generate 3D contribution graph

on:
  workflow_dispatch:
  schedule:
    # Once a day, 18:30 UTC
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  build:
    name: Render and commit SVGs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate 3D contribution SVGs
        # yoshi389111/github-profile-3d-contrib v0.9.3
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push if the SVGs changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No SVG changes; nothing to commit."
            exit 0
          fi

          git commit -m "chore: update 3D contribution graph"
          git push
